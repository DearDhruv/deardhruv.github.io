<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Featured Projects</title>
  <desc id="desc">Header section banner for featured projects.</desc>

  <defs>
    <linearGradient id="purple-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#803FE7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Horizontal divider line across the canvas -->
  <line x1="60" y1="65" x2="1140" y2="65" stroke="#27272a" stroke-width="1.5"/>

  <!-- Left Accent Marker -->
  <rect x="60" y="45" width="6" height="40" rx="3" fill="url(#purple-cyan-grad)"/>

  <!-- Section Number & Text -->
  <text x="82" y="69" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">01 / FEATURED WORK</text>
  <text x="82" y="85" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">SELECTED MOBILE PLATFORMS &amp; SYSTEMS</text>
  
  <!-- Right metadata indicator -->
  <rect x="1000" y="55" width="140" height="20" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <circle cx="1012" cy="65" r="3" fill="#38bdf8"/>
  <text x="1022" y="69" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.5">SOURCE CODE</text>
</svg>
