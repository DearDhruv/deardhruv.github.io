  <circle cx="1002" cy="65" r="3" fill="#10b981"/>
  <text x="1012" y="69" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.5">COMPATIBILITY</text>
