  <!-- Section Number & Text -->
  <text x="82" y="69" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">03 / TECHNICAL SYSTEMS</text>
  <text x="82" y="85" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">CORE ARCHITECTURE &amp; TOOLING STACK</text>
  
  <!-- Right metadata indicator -->
