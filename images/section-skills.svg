  <desc id="desc">Header section banner for technical systems and core expertise.</desc>

  <defs>
    <linearGradient id="green-teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Horizontal divider line -->
  <line x1="60" y1="65" x2="1140" y2="65" stroke="#27272a" stroke-width="1.5"/>

